<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>Smash Emu</title>
	<link rel="stylesheet" href="smash://app/renderer/themes.css">
	<link rel="stylesheet" href="smash://app/renderer/fonts.css">
	<link rel="stylesheet" href="player.css">
	<style>
		#stage { display: grid; place-items: center; }
		.waiting { display: flex; flex-direction: column; align-items: center; gap: 18px; color: #9a9aa2; }
		.waiting .wordmark { font-size: 22px; }
		.waiting .msg { font-family: 'Press Start 2P', monospace; font-size: 9px; text-align: center; line-height: 1.8; max-width: 640px; }
		.wait-help { max-width: 620px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 14px 16px; color: #d5d5da; font-size: 13.5px; line-height: 1.55; text-align: left; }
		.wait-help p { margin: 0 0 10px; }
		.wait-help pre { margin: 0 0 12px; padding: 8px 10px; background: rgba(0, 0, 0, 0.4); border-radius: 8px; font-size: 11px; color: #ff9a7a; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: auto; }
		.wait-help .acts { display: flex; gap: 8px; flex-wrap: wrap; }
		.slotsel { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--brand); padding: 0 6px; }
		.tb.on { background: rgba(var(--brand-rgb), 0.22); color: var(--brand); }
		.clock { font-family: 'Press Start 2P', monospace; font-size: 9px; color: #b9b9c0; padding: 0 10px; white-space: nowrap; }
		body.bar-hidden .bar { transform: translateY(-100%); opacity: 0; }
		body.bar-hidden #stage { inset: 0; }

		/* Panneau Smash Emu : image figée du jeu en fond, fenêtre du jeu masquée. */
		#panel { position: fixed; inset: 48px 0 0 0; z-index: 30; display: flex; align-items: stretch; justify-content: center; background: #000 center / cover no-repeat; }
		body.bar-hidden #panel { inset: 0; }
		#panel::before { content: ''; position: absolute; inset: 0; background: rgba(8, 8, 10, 0.84); backdrop-filter: blur(10px); }
		.pn { position: relative; width: min(980px, 94vw); margin: 22px 0; display: flex; flex-direction: column; background: rgba(18, 18, 21, 0.96); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 0 0 2px rgba(var(--brand-rgb), 0.35), 0 20px 60px rgba(0, 0, 0, 0.6); overflow: hidden; }
		.pn-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
		.pn-head .ttl { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--brand); margin-right: 14px; }
		.pn-tab { border: none; background: transparent; color: #b9b9c0; padding: 8px 12px; border-radius: 9px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
		.pn-tab:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }
		.pn-tab.on { background: rgba(var(--brand-rgb), 0.2); color: var(--brand); }
		.pn-body { padding: 18px; overflow-y: auto; flex: 1; }
		.pn-foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
		.pn-foot .grow, .pn-head .grow { flex: 1; }
		.btn { border: none; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; background: rgba(255, 255, 255, 0.08); color: #fff; display: inline-flex; gap: 7px; align-items: center; }
		.btn:hover { background: rgba(255, 255, 255, 0.14); }
		.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: var(--glow); }
		.btn.danger { background: rgba(232, 17, 35, 0.2); color: #ff6b78; }
		.grp { margin-bottom: 18px; }
		.grp > .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #8a8a93; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
		.grp > .lbl span { text-transform: none; letter-spacing: 0; font-weight: 500; }
		.chips { display: flex; flex-wrap: wrap; gap: 6px; }
		.chip { border: 1.5px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); color: #d5d5da; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
		.chip:hover { border-color: rgba(var(--brand-rgb), 0.6); }
		.chip.on { border-color: var(--brand); background: rgba(var(--brand-rgb), 0.18); color: var(--brand); }
		.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
		.slot { position: relative; border-radius: 12px; overflow: hidden; background: #0c0c0e; border: 1.5px solid rgba(255, 255, 255, 0.1); aspect-ratio: 4 / 3; display: flex; flex-direction: column; justify-content: flex-end; }
		.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
		.slot.empty { background: repeating-linear-gradient(45deg, #0c0c0e, #0c0c0e 8px, #111114 8px, #111114 16px); }
		.slot .meta { position: relative; padding: 6px 8px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.85), transparent); font-size: 11px; color: #cfcfd4; }
		.slot .n { position: absolute; top: 6px; left: 6px; font-family: 'Press Start 2P', monospace; font-size: 9px; background: var(--brand); color: var(--on-brand); padding: 4px 6px; border-radius: 6px; }
		.slot .acts { position: relative; display: flex; gap: 6px; padding: 0 8px 8px; }
		.slot .acts .btn { flex: 1; justify-content: center; padding: 6px 4px; font-size: 12px; }
		.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
		.range { display: flex; align-items: center; gap: 10px; }
		.range input { flex: 1; accent-color: var(--brand); }
		.range output { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--brand); min-width: 44px; text-align: right; }
		.note { font-size: 12px; color: #8a8a93; line-height: 1.5; }
		.warn { background: rgba(var(--brand-rgb), 0.12); border: 1px solid rgba(var(--brand-rgb), 0.4); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: #e6e6ea; }
		.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
		.tools .btn { justify-content: flex-start; padding: 12px; }
		.rp-keys { display: grid; grid-template-columns: 1fr; gap: 3px; max-height: 220px; overflow-y: auto; }
		.rp-keys > div { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 11.5px; }
		.rp-keys b { color: var(--brand); font-weight: 800; }
		.rp-keys .rp-chip { padding: 2px 8px; font-size: 11px; }

		/* Écran de chargement avec la mascotte (petite manette en pixel art, création originale). */
		.ld-bg { position: fixed; inset: 48px 0 0 0; background: #000 center / cover no-repeat; filter: blur(26px) saturate(1.3) brightness(0.45); transform: scale(1.1); opacity: 0; transition: opacity 0.8s; pointer-events: none; }
		.ld-bg.on { opacity: 1; }
		#waiting { position: relative; z-index: 1; }
		.ld-scene { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(420px, 86vw); }
		.ld-track { position: relative; width: 100%; height: 84px; }
		.ld-mascot { position: absolute; bottom: 0; left: 0; width: 104px; height: 78px; transform: translateX(-50%); transition: left 0.3s ease-out; }
		.ld-mascot svg { position: relative; width: 100%; height: 100%; animation: ldHop 0.26s ease-in-out infinite; image-rendering: pixelated; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45)); }
		.ld-mascot .fa { animation: ldStepA 0.26s steps(1) infinite; }
		.ld-mascot .fb { animation: ldStepB 0.26s steps(1) infinite; }
		/* Traits de vitesse derrière la mascotte, plus forts à chaque nouvelle étape. */
		.ld-mascot::before { content: ''; position: absolute; right: 82%; top: 30%; width: 46px; height: 34%; background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0 3px, transparent 3px 9px); -webkit-mask: linear-gradient(90deg, transparent, #000); mask: linear-gradient(90deg, transparent, #000); opacity: 0.45; animation: ldSpeed 0.3s linear infinite; }
		.ld-mascot.dash::before { animation: ldSpeed 0.3s linear infinite, ldDash 0.9s ease-out; }
		.ld-mascot.dash svg { animation: ldHop 0.26s ease-in-out infinite, ldLean 0.9s ease-out; }
		@keyframes ldSpeed { from { transform: translateX(8px); } to { transform: translateX(-8px); } }
		@keyframes ldDash { 0% { opacity: 1; width: 90px; } 100% { opacity: 0.45; width: 46px; } }
		@keyframes ldLean { 0%, 60% { rotate: 8deg; } 100% { rotate: 0deg; } }
		.ld-meta { display: flex; justify-content: space-between; width: 100%; margin-top: -4px; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #8d8d96; }
		.ld-meta #ld-pct { color: var(--brand); }
		#ld-scene #loading-progress { transition: width 0.15s linear; }
		.ld-mascot .eyes { transform-origin: 50% 37%; animation: ldBlink 3.6s infinite; }
		.ld-mascot .pupil { animation: ldLook 4s ease-in-out infinite; }
		@keyframes ldHop { 50% { transform: translateY(-5px) rotate(-3deg); } }
		@keyframes ldStepA { 50% { opacity: 0; } }
		@keyframes ldStepB { 0% { opacity: 0; } 50% { opacity: 1; } }
		@keyframes ldBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
		@keyframes ldLook { 0%, 40% { transform: translateX(0); } 50%, 80% { transform: translateX(1px); } }
		.ld-bubble { position: relative; max-width: 100%; padding: 8px 14px; border-radius: 14px; background: #fff; color: #1d2026; font-weight: 800; font-size: 13px; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); animation: ldPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
		.ld-bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); }
		@keyframes ldPop { from { opacity: 0; transform: scale(0.8) translateY(6px); } }
		.ld-scene .loading-bar { width: 100%; }
		.ld-tip { min-height: 34px; font-size: 12.5px; color: #c9c9d0; text-align: center; line-height: 1.45; transition: opacity 0.3s; }
		.ld-tip b { color: var(--brand); }
	</style>
</head>
<body>
	<header class="bar" id="bar">
		<div class="bar-left drag">
			<span class="logo" id="logo"></span>
			<div class="game-title"><span id="game-name">Chargement…</span><span class="sub" id="game-sub"></span></div>
		</div>
		<div class="bar-center" id="controls">
			<button class="tb" data-action="pause" data-need="pause" id="btn-pause" data-tip="Pause / reprise"><span data-icon="pause"></span></button>
			<button class="tb" data-action="turbo" data-need="turbo" id="btn-turbo" data-tip="Turbo (vitesse illimitée)"><span data-icon="fast-forward"></span></button>
			<div class="sep" data-need="states"></div>
			<button class="tb wide" data-action="save" data-need="states" data-tip="Sauvegarder l'état"><span data-icon="save"></span><span>Sauver</span></button>
			<button class="tb wide" data-action="load" data-need="states" data-tip="Charger l'état"><span data-icon="history"></span><span>Charger</span></button>
			<button class="tb" data-action="slot" data-need="states" data-tip="Changer d'emplacement"><span class="slotsel" id="slot">1</span></button>
			<button class="tb" data-action="undo" data-need="undo" data-tip="Annuler le dernier chargement"><span data-icon="rotate-ccw"></span></button>
			<div class="sep"></div>
			<button class="tb rp-btn" data-action="remote" data-need="remote" data-tip="Jouer à distance : ton ami en joueur 2 (Ctrl+J)"><span data-icon="wifi"></span><span class="rp-badge hidden" id="remote-badge"></span></button>
			<button class="tb" data-action="screenshot" data-tip="Capture d'écran (Ctrl+Maj+S)"><span data-icon="camera"></span></button>
			<button class="tb wide" data-action="controls" data-tip="Régler les manettes dans l'émulateur"><span data-icon="gamepad-2"></span><span>Manettes</span></button>
			<button class="tb wide" data-action="panel" id="btn-panel" data-tip="Panneau Smash Emu (Ctrl+P)"><span data-icon="sparkles"></span><span>Menu</span></button>
		</div>
		<div class="bar-right">
			<span class="clock" id="clock" data-tip="Temps de jeu">00:00</span>
			<button class="wc" data-action="minimize"><span data-icon="minus"></span></button>
			<button class="wc" data-action="fullscreen" id="btn-fs" data-tip="Plein écran (F11)"><span data-icon="maximize"></span></button>
			<button class="wc close" data-action="close"><span data-icon="x"></span></button>
		</div>
	</header>
	<main id="stage">
		<div class="ld-bg" id="ld-bg"></div>
		<div class="waiting" id="waiting">
			<div id="splash"></div>
			<div class="msg" id="wait-msg">DEMARRAGE DE L'EMULATEUR…</div>
			<div class="ld-scene" id="ld-scene">
				<div class="ld-bubble" id="ld-bubble">On y va !</div>
				<div class="ld-track"><div class="ld-mascot" id="ld-mascot"></div></div>
				<div class="loading-bar" id="loading-bar"><div id="loading-progress" style="width:4%"></div></div>
				<div class="ld-meta"><span id="ld-pct">0 %</span><span id="ld-time">0 s</span></div>
				<div class="ld-tip" id="ld-tip"></div>
			</div>
			<div class="wait-help hidden" id="wait-help"></div>
		</div>
	</main>
	<section id="panel" class="hidden"></section>
	<div class="toasts" id="toasts"></div>
	<div class="tooltip hidden" id="tooltip"></div>
	<script src="smash://app/renderer/icons.js"></script>
	<script src="smash://app/renderer/logo.js"></script>
	<script src="smash://app/renderer/game-themes.js"></script>
	<script src="remote-common.js"></script>
	<script src="external.js"></script>
	<script src="remote-host.js"></script>
</body>
</html>
